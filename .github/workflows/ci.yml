name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core-tests:
    name: Pure tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore tests/ImageForge.Core.Tests --locked-mode
      - run: dotnet test --project tests/ImageForge.Core.Tests --no-restore -c Release
      # Windows-targeted engine projects compile on Linux; they are not run here.
      - run: dotnet build src/ImageForge.Engine.Host -c Release
      - run: dotnet build tools/ImageForge.Experiments -c Release

  windows-build:
    name: Build all (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore ImageForge.slnx --locked-mode
      - run: dotnet build ImageForge.slnx --no-restore -c Release
      # Only pure tests run in CI. Engine integration checks run manually in a VM (plan, section 16).
      - run: dotnet test --project tests/ImageForge.Core.Tests --no-build -c Release
      # Self-contained experiment tool for the manual VM checks; its SHA-256 identifies the build in the test package.
      - run: dotnet publish tools/ImageForge.Experiments -c Release -o artifacts/experiments
      - name: Hash experiment tool
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/experiments/ImageForge.Experiments.exe -Algorithm SHA256).Hash
          "$hash  ImageForge.Experiments.exe" | Out-File -Encoding ascii artifacts/experiments/SHA256.txt
          "BuildId: ${{ github.sha }} (run ${{ github.run_number }})" | Out-File -Encoding ascii -Append artifacts/experiments/SHA256.txt
          Get-Content artifacts/experiments/SHA256.txt
          "### ImageForge.Experiments`n``$hash``" | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
      # Unpackaged app with the engine in .\engine, for the manual UAC/pipe check.
      - run: dotnet publish src/ImageForge.App -c Release -o artifacts/app
      - run: dotnet publish src/ImageForge.Engine.Host -c Release -o artifacts/app/engine
      - name: Hash app bundle
        shell: pwsh
        run: |
          $lines = foreach ($f in 'ImageForge.App.exe', 'engine/ImageForge.Engine.Host.exe') {
            "$((Get-FileHash "artifacts/app/$f" -Algorithm SHA256).Hash)  $f"
          }
          $lines + "BuildId: ${{ github.sha }} (run ${{ github.run_number }})" | Out-File -Encoding ascii artifacts/app/SHA256.txt
          Get-Content artifacts/app/SHA256.txt
          "### ImageForge.App`n``````n$($lines -join "`n")`n``````" | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: ImageForge.App-${{ github.sha }}
          path: artifacts/app
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ImageForge.Experiments-${{ github.sha }}
          path: |
            artifacts/experiments/ImageForge.Experiments.exe
            artifacts/experiments/SHA256.txt
          retention-days: 30
